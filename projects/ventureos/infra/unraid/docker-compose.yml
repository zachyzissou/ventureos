version: '3.8'

networks:
  ventureos:
    driver: bridge

services:
  postgres_ventureos:
    image: postgres:16
    container_name: ventureos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_VENTUREOS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_VENTUREOS_PASSWORD}
      POSTGRES_DB: ${POSTGRES_VENTUREOS_DB}
    volumes:
      - /mnt/user/storage/ventureos/postgres:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks: [ventureos]

  postgres_temporal:
    image: postgres:16
    container_name: temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEMPORAL_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEMPORAL_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEMPORAL_DB}
    volumes:
      - /mnt/user/storage/ventureos/temporal-postgres:/var/lib/postgresql/data
    ports:
      - "15433:5432"
    networks: [ventureos]

  postgres_keycloak:
    image: postgres:16
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
    volumes:
      - /mnt/user/storage/ventureos/keycloak-postgres:/var/lib/postgresql/data
    ports:
      - "15434:5432"
    networks: [ventureos]

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: temporal
    restart: unless-stopped
    environment:
      - DB=postgresql
      - POSTGRES_SEEDS=postgres_temporal
      - POSTGRES_USER=${POSTGRES_TEMPORAL_USER}
      - POSTGRES_PWD=${POSTGRES_TEMPORAL_PASSWORD}
      - POSTGRES_DB=${POSTGRES_TEMPORAL_DB}
      - POSTGRES_PORT=5432
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    depends_on:
      - postgres_temporal
    ports:
      - "7233:7233"
    networks: [ventureos]

  temporal_ui:
    image: temporalio/ui:2.26.2
    container_name: temporal-ui
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    ports:
      - "8233:8080"
    networks: [ventureos]

  minio:
    image: minio/minio:latest
    container_name: ventureos-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - /mnt/user/storage/ventureos/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [ventureos]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ventureos-qdrant
    restart: unless-stopped
    volumes:
      - /mnt/user/storage/ventureos/qdrant:/qdrant/storage
    ports:
      - "6333:6333"
    networks: [ventureos]

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: ventureos-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - /mnt/user/storage/ventureos/meili:/meili_data
    ports:
      - "7700:7700"
    networks: [ventureos]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: ventureos-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres_keycloak
      KC_DB_URL_DATABASE: ${POSTGRES_KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    depends_on:
      - postgres_keycloak
    ports:
      - "8081:8080"
    networks: [ventureos]

  prometheus:
    image: prom/prometheus:latest
    container_name: ventureos-prometheus
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/ventureos/prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    networks: [ventureos]

  loki:
    image: grafana/loki:2.9.5
    container_name: ventureos-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - /mnt/user/appdata/ventureos/loki:/etc/loki
    ports:
      - "3100:3100"
    networks: [ventureos]

  grafana:
    image: grafana/grafana:latest
    container_name: ventureos-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - /mnt/user/appdata/ventureos/grafana:/var/lib/grafana
    ports:
      - "3300:3000"
    networks: [ventureos]
