openapi: 3.0.3
info:
  title: VentureOS Documents + Notes API
  version: 0.1.0
  description: |
    OpenAPI spec for VentureOS Documents and Notes (M1).

    This spec is designed to align with the core conventions in:
    - docs/process/API_Core_CRUD.md

servers:
  - url: /api/v1

security:
  - BearerAuth: []

tags:
  - name: Documents
  - name: DocumentRevisions
  - name: Notes
  - name: Tags

paths:
  /documents:
    get:
      summary: List documents
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/ParentType'
        - $ref: '#/components/parameters/ParentId'
        - $ref: '#/components/parameters/CreatedBy'
        - $ref: '#/components/parameters/DocumentStatus'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDocumentsResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create document (creates initial revision v1)
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /documents/search:
    get:
      summary: Search documents (alias of list with q)
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/QRequired'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/ParentType'
        - $ref: '#/components/parameters/ParentId'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDocumentsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /documents/{id}:
    get:
      summary: Get document
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: include_current_revision
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: If true, embed the current revision content in the response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update document metadata (does not create a revision)
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      summary: Archive document (soft delete)
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Archived
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/restore:
    post:
      summary: Restore archived document
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /documents/{id}/revisions:
    get:
      summary: List document revisions
      tags: [DocumentRevisions]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDocumentRevisionsResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a new document revision (updates current version)
      tags: [DocumentRevisions]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRevisionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRevisionCreated'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /documents/{id}/revisions/{revision_id}:
    get:
      summary: Get a document revision
      tags: [DocumentRevisions]
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRevision'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notes:
    get:
      summary: List notes
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/ParentType'
        - $ref: '#/components/parameters/ParentId'
        - $ref: '#/components/parameters/CreatedBy'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedNotesResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create note
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /notes/search:
    get:
      summary: Search notes (alias of list with q)
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/QRequired'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/ParentType'
        - $ref: '#/components/parameters/ParentId'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedNotesResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notes/{id}:
    get:
      summary: Get note
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update note
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      summary: Archive note (soft delete)
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Archived
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notes/{id}/restore:
    post:
      summary: Restore archived note
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /documents/tags:
    get:
      summary: List document tags (distinct, for autocomplete)
      tags: [Tags]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Optional prefix filter.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notes/tags:
    get:
      summary: List note tags (distinct, for autocomplete)
      tags: [Tags]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Optional prefix filter.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Field name to sort by.

    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    IncludeArchived:
      name: include_archived
      in: query
      required: false
      schema:
        type: boolean
        default: false

    Q:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Full-text query.

    QRequired:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Full-text query (required).

    Tag:
      name: tag
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      description: Filter by tag (repeatable).

    ParentType:
      name: parent_type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ParentType'

    ParentId:
      name: parent_id
      in: query
      required: false
      schema:
        type: string
        format: uuid

    CreatedBy:
      name: created_by
      in: query
      required: false
      schema:
        type: string
      description: Keycloak subject id.

    DocumentStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DocumentStatus'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    JsonObject:
      type: object
      additionalProperties: true

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              $ref: '#/components/schemas/JsonObject'
            request_id:
              type: string
      required: [error]

    PageMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean
      required: [page, page_size, total, has_more]

    Visibility:
      type: string
      enum: [private, team, org]

    DocumentStatus:
      type: string
      enum: [Draft, Active, Archived]

    ParentType:
      type: string
      description: VentureOS entity type for polymorphic linking.
      enum:
        - idea
        - validation_plan
        - validation_run
        - decision
        - venture
        - build_plan
        - execution_run
        - milestone_review
        - portfolio
        - portfolio_update
        - stakeholder_report
        - document

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/DocumentStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
        tags:
          type: array
          items:
            type: string
        parent_type:
          $ref: '#/components/schemas/ParentType'
        parent_id:
          type: string
          format: uuid
          nullable: true
        current_version:
          type: integer
          minimum: 0
        current_revision_id:
          type: string
          format: uuid
          nullable: true
        current_revision:
          nullable: true
          description: Present when include_current_revision=true.
          allOf:
            - $ref: '#/components/schemas/DocumentRevision'
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
          nullable: true
        updated_by:
          type: string
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        archived_by:
          type: string
          nullable: true
      required:
        - id
        - title
        - status
        - visibility
        - tags
        - current_version
        - created_at
        - created_by

    DocumentCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/DocumentStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
        tags:
          type: array
          items:
            type: string
        parent_type:
          $ref: '#/components/schemas/ParentType'
        parent_id:
          type: string
          format: uuid
        content_markdown:
          type: string
          minLength: 1
      required: [title, visibility, content_markdown]

    DocumentUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/DocumentStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
        tags:
          type: array
          items:
            type: string
        parent_type:
          $ref: '#/components/schemas/ParentType'
        parent_id:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false

    DocumentRevision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        content_markdown:
          type: string
        change_summary:
          type: string
          nullable: true
        source:
          type: string
          description: Producer of the revision (api|obsidian_sync|import).
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
      required: [id, document_id, version, content_markdown, created_at, created_by]

    DocumentRevisionCreate:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
          nullable: true
          description: If provided, must match the document current_version to prevent lost updates.
        content_markdown:
          type: string
          minLength: 1
        change_summary:
          type: string
          nullable: true
        source:
          type: string
          description: Producer of the revision (api|obsidian_sync|import).
          default: api
      required: [content_markdown]
      additionalProperties: false

    DocumentRevisionCreated:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/Document'
        revision:
          $ref: '#/components/schemas/DocumentRevision'
      required: [document, revision]

    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent_type:
          $ref: '#/components/schemas/ParentType'
        parent_id:
          type: string
          format: uuid
        body:
          type: string
        body_format:
          type: string
          enum: [markdown, plaintext]
          default: markdown
        visibility:
          $ref: '#/components/schemas/Visibility'
        tags:
          type: array
          items:
            type: string
        reply_to_note_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
          nullable: true
        updated_by:
          type: string
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        archived_by:
          type: string
          nullable: true
      required: [id, parent_type, parent_id, body, visibility, tags, created_at, created_by]

    NoteCreate:
      type: object
      properties:
        parent_type:
          $ref: '#/components/schemas/ParentType'
        parent_id:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
        body_format:
          type: string
          enum: [markdown, plaintext]
          default: markdown
        visibility:
          $ref: '#/components/schemas/Visibility'
        tags:
          type: array
          items:
            type: string
        reply_to_note_id:
          type: string
          format: uuid
          nullable: true
      required: [parent_type, parent_id, body, visibility]
      additionalProperties: false

    NoteUpdate:
      type: object
      properties:
        body:
          type: string
          minLength: 1
        body_format:
          type: string
          enum: [markdown, plaintext]
        visibility:
          $ref: '#/components/schemas/Visibility'
        tags:
          type: array
          items:
            type: string
      additionalProperties: false

    PagedDocumentsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        page:
          $ref: '#/components/schemas/PageMeta'
      required: [items, page]

    PagedDocumentRevisionsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRevision'
        page:
          $ref: '#/components/schemas/PageMeta'
      required: [items, page]

    PagedNotesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        page:
          $ref: '#/components/schemas/PageMeta'
      required: [items, page]

    TagListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: string
      required: [items]
