version: '3.8'

services:
  api:
    image: makeplane/plane-api:latest
    ports:
      - "8000:8000"
    env_file:
      - ./plane.env

  db:
    image: postgres:15.7-alpine
    environment:
      POSTGRES_USER: planeuser
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: planedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: