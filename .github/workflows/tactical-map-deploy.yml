# Tactical Map Deploy — staging auto, production gated
# Staging runs on push to main and on manual dispatch.
# Production requires manual dispatch + environment approval.

name: Tactical Map Deploy

on:
  push:
    branches: [main]
    paths:
      - 'tactical-map/**'
      - 'tactical-map-server/**'
      - 'dashboard/**'
      - 'lib/**'
      - '.github/workflows/tactical-map-deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

concurrency:
  group: tactical-map-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_NAME: tactical-map-dist-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'
          cache-dependency-path: tactical-map/package-lock.json

      - name: Install dependencies
        working-directory: tactical-map
        run: npm ci

      - name: Run tests before build
        working-directory: tactical-map
        run: npm test

      - name: Build tactical map
        working-directory: tactical-map
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: tactical-map/dist
          if-no-files-found: error

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    env:
      ARTIFACT_NAME: tactical-map-dist-${{ github.sha }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: Staging deploy (placeholder)
        run: |
          echo "Staging deployment would publish dist/ to the staging dashboard host."
          echo "Configure this step with your deploy command or sync target."

  deploy-production:
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    env:
      ARTIFACT_NAME: tactical-map-dist-${{ github.sha }}
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: Production deploy (placeholder)
        run: |
          echo "Production deployment would promote dist/ after approval."
          echo "Set environment protection rules to require manual approval."
