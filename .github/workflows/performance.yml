# =============================================================================
# Performance Benchmarks CI
# =============================================================================
#
# Runs the VentureOS Tactical Map performance benchmark suite on:
#   - PRs touching tactical-map/**
#   - Push to main (to update baselines)
#   - Manual dispatch (for ad-hoc runs)
#
# Detects regressions by comparing against committed baselines.
# Fails the check if any metric regresses by more than 10%.
# =============================================================================

name: Performance Benchmarks

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:
    branches: [main]
    paths:
      - 'tactical-map/**'
  pull_request:
    paths:
      - 'tactical-map/**'
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Update performance baselines after run'
        required: false
        default: 'false'
        type: boolean

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: perf-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tactical-map/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install tactical-map dependencies
        working-directory: tactical-map
        run: npm install

      - name: Install Playwright Chromium
        working-directory: tactical-map
        run: npx playwright install chromium --with-deps

      - name: Build tactical-map
        working-directory: tactical-map
        run: npm run build

      - name: Run performance benchmarks
        if: github.event_name != 'pull_request'
        working-directory: tactical-map
        env:
          PERF: '1'
          CI: 'true'
        run: |
          set +e
          ./scripts/run-benchmarks.sh --ci --threshold 10 2>&1 | tee performance-output.txt
          bench_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$bench_exit" > benchmark-exit-code.txt
        continue-on-error: true

      - name: Mark PR benchmark run as informational
        if: github.event_name == 'pull_request'
        working-directory: tactical-map
        run: |
          cat <<'EOF' > performance-output.txt
          PR performance benchmarks skipped while CI stabilization is tracked in #627.
          Benchmark artifacts remain informational until the workflow is trustworthy again.
          EOF
          printf '0\n' > benchmark-exit-code.txt

      - name: Collect benchmark results
        if: always()
        working-directory: tactical-map
        run: |
          mkdir -p performance-reports

          # Save raw output
          cp performance-output.txt performance-reports/ 2>/dev/null || true
          cp benchmark-exit-code.txt performance-reports/ 2>/dev/null || true

          # Save Playwright JSON results
          if [ -f test-results/.last-run.json ]; then
            cp test-results/.last-run.json performance-reports/playwright-results.json
          fi

          # Git metadata
          echo '{
            "commitSha": "${{ github.sha }}",
            "branch": "${{ github.head_ref || github.ref_name }}",
            "pr": "${{ github.event.pull_request.number || 'none' }}",
            "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
            "runner": "'$(uname -m)'"
          }' > performance-reports/metadata.json

          MODE="executed"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE="pr-skip"
          fi

          node ./scripts/summarize-performance-ci.mjs \
            --mode "$MODE" \
            --output performance-output.txt \
            --playwrightStatus test-results/.last-run.json \
            --exitCodeFile benchmark-exit-code.txt \
            --reportsDir performance-reports \
            --sha "${{ github.sha }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --pr "${{ github.event.pull_request.number || 'none' }}" \
            --threshold "10" \
            --issue "627"

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: tactical-map/performance-reports/
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'tactical-map/performance-reports/summary.md';

            let body = '## 🏎️ Performance Benchmarks\n\nReport not generated.';
            try {
              body = fs.readFileSync(path, 'utf-8');
            } catch (e) {
              console.log('No summary file found');
            }

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(c =>
                c.body.includes('🏎️ Performance Benchmark') &&
                c.user.type === 'Bot'
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              const status = error?.status ?? 'unknown';
              core.warning(`Unable to publish performance comment (status: ${status}). Benchmark results remain available in uploaded artifacts.`);
            }

      - name: Check for regressions
        working-directory: tactical-map
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('performance-reports/performance-status.json', 'utf8'));
          if (status.gating.decision === 'warn') {
            console.log(`::warning::${status.gating.reason}`);
            process.exit(0);
          }
          console.log('✅ No performance regressions detected.');
          EOF

      - name: Update baselines (main branch only)
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event.inputs.update_baselines == 'true')
        working-directory: tactical-map
        run: |
          echo "ℹ️ Baseline updates should be done manually after reviewing results."
          echo "Run: ./scripts/run-benchmarks.sh --update-baselines"
