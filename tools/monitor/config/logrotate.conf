# Log rotation for Monitor-Agent
# macOS doesn't use logrotate by default, but this documents the policy

/Users/zachgonser/clawd/monitor/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 zachgonser staff
    sharedscripts
    postrotate
        # Signal process to reopen logs (if needed)
        pkill -HUP -f "python.*monitor.main_loop" || true
    endscript
}
